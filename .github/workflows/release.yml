name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  check_branch:
    name: "Check if tag is on aplay2-backup branch"
    runs-on: ubuntu-latest
    outputs:
      is_correct_branch: ${{ steps.check.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if tag is on aplay2-backup branch
        id: check
        run: |
          if git branch -r --contains ${{ github.ref }} | grep -q "origin/aplay2-backup"; then
            echo "result=true" >> $GITHUB_OUTPUT
          else
            echo "result=false" >> $GITHUB_OUTPUT
          fi
