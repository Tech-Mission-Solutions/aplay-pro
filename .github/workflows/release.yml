  publish_windows:
    name: "Publish Windows"
    runs-on: windows-2022
    permissions:
      contents: read
    #      id-token: write # REQUIRED for Azure OIDC

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Change Python version: https://github.com/nodejs/node-gyp/issues/2869
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Cache Electron artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - run: az logout || true

      #      - name: Azure Login (OIDC)
      #        uses: azure/login@v2
      #        with:
      #          client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      #      #   enable-AzPSSession: true

      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Export Azure env vars for Trusted Signing
        shell: pwsh
        run: |
          echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $env:GITHUB_ENV
          echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $env:GITHUB_ENV
          echo "AZURE_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $env:GITHUB_ENV
          echo "AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> $env:GITHUB_ENV

      - name: Debug GitHub context
        run: |
          echo "Ref: $GITHUB_REF"
          echo "Repository: $GITHUB_REPOSITORY"

      - name: Verify Azure env vars
        shell: pwsh
        run: |
          Get-ChildItem Env:AZURE*

      #          echo "Federated token file:"
      #          Test-Path $env:AZURE_FEDERATED_TOKEN_FILE

      # Build Windows artifacts
      - name: Build Windows App
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          ELECTRON_BUILDER_HTTP_TIMEOUT: 600000
          ELECTRON_BUILDER_HTTP_RETRY: 5
        run: npm run release

